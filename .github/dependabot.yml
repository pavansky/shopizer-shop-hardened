# Weekly dependency updates. Minor and patch updates are grouped into one pull request per
# ecosystem; major versions (React, react-scripts, Node) are left to a planned upgrade.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # browser tests (tests/e2e); CI installs the matching browser with npx playwright install,
  # so an update here needs no other change
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule: { interval: weekly, day: monday }
    groups:
      playwright: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
