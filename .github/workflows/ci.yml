name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
      - run: npm ci
      # CI=true makes react-scripts treat lint warnings as errors.
      - run: npm run build
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:8080/api
