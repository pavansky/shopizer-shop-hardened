# API origin on another host name (APP_API_URL without the /api path). An API on
# the same host as this UI is already allowed by $csp_same_host below; for another
# host a deployment replaces this when the container starts:
#   sed -i "s#http://localhost:8080#${API_ORIGIN}#" /etc/nginx/conf.d/default.conf
map $host $csp_api_origin {
  default "http://localhost:8080";
}

server {
  listen 80;
  server_tokens off;

  # The API (and shipping service) on the host the page was loaded from, any
  # port: covers the compose API_PORT setting and any deployment that serves
  # the UI and the API from one host name, with no start-up substitution.
  # $host is the validated, lower-cased Host header of this request.
  set $csp_same_host "$scheme://$host:*";

  # $request_id is 128 random bits per request: used as the CSP nonce of the
  # inline bootstrap script that the React build writes into index.html.
  set $csp "default-src 'self'; script-src 'self' 'nonce-$request_id' https://js.stripe.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: $csp_same_host $csp_api_origin; connect-src 'self' $csp_same_host $csp_api_origin https://api.stripe.com https://maps.googleapis.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self \"https://js.stripe.com\")" always;

  # never serve dotfiles (.env) or the start-up script
  location ~ /\. {
    deny all;
  }
  location = /env.sh {
    deny all;
  }

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    expires -1; # Set it to different value depending on your standard requirements
    sub_filter_once off;
    sub_filter '<script>' '<script nonce="$request_id">';
  }
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
